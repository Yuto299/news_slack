name: "#pain-points 課題発見 (毎日 12:00)"

on:
  schedule:
    # 配信の 15 分前に起動し、予備の起動時刻を 2 つ置く（投稿済みなら何もしない）
    - cron: "45 2 * * *" # 11:45 JST
    - cron: "10 3 * * *" # 12:10 JST（予備）
    - cron: "40 3 * * *" # 12:40 JST（予備）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Slack に投稿せず、結果をログに表示するだけ"
        type: boolean
        default: false
      scheduled:
        description: "定期実行として扱う（cron-job.org から起動するとき用。手動実行ではチェック不要）"
        type: boolean
        default: false

# 履歴の保存が前後の実行と競合しないよう、チャンネルごとに同時実行は 1 つ。
# GitHub の起動が遅れて本番と予備の起動が重なると、待機中の実行は GitHub により自動でキャンセルされる
# （先に動いている実行が投稿するので問題なし）。ここに書くと「失敗」ではなく「キャンセル」と表示される。
concurrency:
  group: bot-pain-points
  cancel-in-progress: false

jobs:
  run:
    permissions:
      contents: write  # 投稿内容を archive/ にコミットするため
    uses: ./.github/workflows/_run-channel.yml
    secrets: inherit
    with:
      channel: pain-points
      webhook_secret: SLACK_WEBHOOK_PAIN_POINTS
      dry_run: ${{ inputs.dry_run || false }}
      scheduled: ${{ inputs.scheduled || false }}
